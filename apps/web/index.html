<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#121C16" />
    <title>Not 404</title>
    <meta name="description" content="Not 404: 3D maps of real places, made by the people who know them. Never 404 in real life." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Apply the saved text size and motion setting before the first paint,
      // so the page doesn't jump from small to large text. See src/lib/preferences.tsx.
      try {
        var p = JSON.parse(localStorage.getItem("path.preferences.v1") || "{}");
        var scale = { default: "100%", large: "118.75%", xlarge: "137.5%" }[p.textSize];
        if (scale) document.documentElement.style.fontSize = scale;
        if (p.motion === "reduce" || p.motion === "full") document.documentElement.dataset.motion = p.motion;
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;500&family=Atkinson+Hyperlegible+Next:wght@400;700&family=Overpass:wght@800;900&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
