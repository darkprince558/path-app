name: Refresh team task board

on:
  workflow_dispatch:
  issues:
    types: [opened, edited, deleted, transferred, assigned, unassigned, labeled, unlabeled, reopened, closed]
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  issues: write

jobs:
  refresh:
    if: >-
      vars.TEAM_BOARD_ISSUE != '' &&
      (github.event_name == 'workflow_dispatch' ||
      (!github.event.issue.pull_request && github.event.issue.number != fromJSON(vars.TEAM_BOARD_ISSUE) &&
      (contains(github.event.issue.labels.*.name, 'task:active') ||
      contains(github.event.issue.labels.*.name, 'task:ready') ||
      github.event.label.name == 'task:active' || github.event.label.name == 'task:ready')))
    concurrency:
      group: team-task-board
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - run: python3 scripts/task_board.py
        env:
          GH_TOKEN: ${{ github.token }}
          TEAM_BOARD_ISSUE: ${{ vars.TEAM_BOARD_ISSUE }}
