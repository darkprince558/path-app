name: Check scan sharing and venue fixture

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make check

  lidar-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/capture/processor/package-lock.json
      - run: npm ci --prefix apps/capture/processor
      - run: npm test --prefix apps/capture/processor
